[scene]
name = C1-specular-blinds
root = .
out = ./output
views = ../common/views.pts
nview = auto
nproc = 16
weather = ../common/shanghai.wea
sky_receiver = ../common/skyglowR1.rad
materials = ./materials.rad
black_materials = ./materials_b.rad
scene = ./Off_scene-1.rad

[workflow]
quality = balanced
directlobecontrast = auto
specularcontrast = auto
bsdf_matrix = auto
ttsuncontrast = auto
ev_strategy = auto

[auto_window_groups]
enabled = auto
orientation_tolerance_deg = 5
minimum_area = 0.01
receiver_offset = 0.08
interior_point =

[runtime]
shell = bash
resume = true
skip_preflight = false
path_prepend = ../../build-release/bin:/usr/local/bin

[radiance]
mf = 1
photometric_weights = 47.4 119.9 11.6
background_ab = 5
background_direct_ab = 1
view_ab = 1
daylight_ab = 5
daylight_direct_ss = 16

[directlobecontrast]
include_illuminance = auto
lobe_disk_pilot_resolution = 0
lobe_disk_pilot_guard_angle = 1

[specularcontrast]
allowlist = ./mirror.mod
include_illuminance = auto
max_specular_bounces = 2
extra_args = --all-normal-pairs

[dcglare2]
output = ${scene:out}/dgp_annual.mtx

