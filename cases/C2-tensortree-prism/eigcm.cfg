[scene]
name = C2-tensortree-prism
root = .
out = ./output
views = ../common/views.pts
nview = auto
nproc = 16
weather = ../common/shanghai.wea
sky_receiver = ../common/skyglowR1.rad
materials = ./materials_PRISM.rad
black_materials = ./materials_b_PRSIM.rad
scene = ./Off_scene-PRISM.rad

[workflow]
quality = balanced
directlobecontrast = auto
specularcontrast = auto
bsdf_matrix = auto
ttsuncontrast = auto
ev_strategy = auto

[auto_window_groups]
enabled = auto
orientation_tolerance_deg = 5
minimum_area = 0.01
receiver_offset = 0.08
interior_point =
open_scene = ./Off_scene-PRISM_no_window.rad
open_materials = ./materials_PRISM.rad
open_black_materials = ./materials_b_PRSIM.rad

[runtime]
shell = bash
resume = true
skip_preflight = false
path_prepend = ../../build/bin:/usr/local/bin

[radiance]
mf = 1
photometric_weights = 47.4 119.9 11.6
background_ab = 5
background_direct_ab = 1
view_ab = 1
daylight_ab = 5
daylight_direct_ss = 16

[specularcontrast]
allowlist = ./prism_specular_auto_allowlist.mod
include_illuminance = auto
max_specular_bounces = 2

[bsdf]
xml = ./zhen1_vis_tt80.xml
direction = tb
diffuse_matrix_samples = 1
matrix_seed = 19
sun_samples = 1000
sun_ad = 10000
sun_lw = 0.0001

[ttsuncontrast]
sun_disk_samples = 1
sample_seed = 1

[dcglare2]
output = ${scene:out}/dgp_annual.mtx
