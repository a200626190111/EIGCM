# EIGCM scheduler configuration. Paths may be absolute or relative to this file.
# Multiline path lists are recommended. ${section:option} interpolation is supported.

[scene]
name = example
root = /mnt/e/papermodel2
out = ${root}/eigcm_runs/example
views = ${root}/views/indoor_viewpoints_collision_free_0p5m_h1p3m.txt
nview = auto
nproc = 16
weather = ${root}/weather/shanghai.wea
sky_receiver = ${root}/skyglowR1.rad
materials =
    ${root}/materials_PRISM.rad
black_materials =
    ${root}/materials_b_PRSIM.rad
scene =
    ${root}/Off_scene-PRISM.rad

[workflow]
# draft, balanced, or high. Any individual value below may override the profile.
quality = balanced
# Each selector accepts auto, true, or false.
directlobecontrast = auto
specularcontrast = auto
bsdf_matrix = auto
ttsuncontrast = auto
# auto selects bsdf_sun when a BSDF group is present and path_components otherwise.
ev_strategy = auto
specularity_threshold = 0.05
roughness_threshold = 0.0001
# Restrict automatic inspection when a material file contains unused definitions.
material_include =
material_exclude =

[auto_window_groups]
# auto enables discovery when no explicit [windowgroup:*] sections exist.
enabled = auto
# Fenestration polygons are grouped by optical material and inward normal.
orientation_tolerance_deg = 5
minimum_area = 0.01
# Move generated rfluxmtx receivers slightly into the room.
receiver_offset = 0.08
# Optional point known to be inside the room. When blank, each window uses the
# nearest position from scene.views; the geometry centre is the final fallback.
interior_point =
material_include =
material_exclude =
# BSDF groups need the scene with physical window polygons removed.
open_scene =
    ${scene:root}/Off_scene-PRISM_no_window.rad
open_materials =
    ${scene:root}/materials_PRISM.rad
open_black_materials =
    ${scene:root}/materials_b_PRSIM.rad

[runtime]
shell = bash
resume = true
skip_preflight = false
# Optional directory containing custom EIGCM/Radiance executables.
path_prepend = /mnt/e/papermodel2:/usr/local/bin

[commands]
oconv = oconv
gendaymtx = gendaymtx
rfluxmtx = rfluxmtx
rcontrib = rcontrib
dctimestep = dctimestep
rmtxop = rmtxop
rcrop = rcrop
getinfo = getinfo
rlam = rlam
rcollate = rcollate
bsdf2reinhart = bsdf2reinhart
directlobecontrast = directlobecontrast
specularcontrast = specularcontrast
ttsuncontrast = ttsuncontrast
dcglare2 = dcglare2

[radiance]
mf = 1
photometric_weights = 47.4 119.9 11.6
background_ab = 5
background_direct_ab = 1
background_ad =
background_lw =
view_ab = 1
view_ad =
view_lw =
daylight_ab = 5
daylight_ad =
daylight_lw =
daylight_c =
daylight_direct_ss = 16

[directlobecontrast]
include_illuminance = auto
sun_samples =
lobe_samples =
lobe_disk_resolution =
lobe_disk_pilot_resolution = 0
lobe_disk_pilot_guard_angle = 1
extra_args =

[specularcontrast]
sun_disk_samples =
secondary_sun_disk_samples =
rough_samples =
rough_secondary_samples =
reflection_level =
max_specular_bounces = 2
block_size = 2048
threshold = 2000
# Auto adds mirror illuminance for explicit-geometry workflows and leaves it in
# the finite-sun replacement for BSDF workflows.
include_illuminance = auto
# Set this to a hand-curated modifier list to override the generated list.
allowlist = ${scene:root}/prism_specular_auto_allowlist.mod
extra_args =

[bsdf]
# Optional additional XML files used during automatic inspection.
xml =
direction = tb
bsdf_matrix_samples =
diffuse_matrix_samples = 1
matrix_seed = 19
sun_samples = 1000
sun_ad = 10000
sun_lw = 0.0001

[ttsuncontrast]
bsdf_samples =
sun_disk_samples = 1
sample_seed = 1
extra_args =

[dcglare2]
output = ${scene:out}/dgp_annual.mtx
threshold =
extra_args =

# Explicit [windowgroup:name] sections remain supported and override an
# automatically generated group with the same name.
